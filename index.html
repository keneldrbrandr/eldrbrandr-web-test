<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EldrBrandr website development test page.">
  <title>EldrBrandr | Web Test</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111820; color: #f4f6f8; display: flex; flex-direction: column; }
    header { padding: 2rem clamp(1.5rem, 6vw, 6rem); border-bottom: 1px solid #34404a; font-weight: 800; letter-spacing: .08em; }
    main { flex: 1; display: flex; align-items: center; padding: 5rem clamp(1.5rem, 6vw, 6rem); }
    .content { max-width: 780px; }
    .eyebrow { color: #89c9ed; font-size: .85rem; text-transform: uppercase; letter-spacing: .2em; font-weight: bold; }
    h1 { font-size: clamp(3rem, 9vw, 6.5rem); line-height: 1.03; letter-spacing: -.045em; margin: 1.2rem 0; }
    p { max-width: 580px; color: #c6d0d9; font-size: clamp(1rem, 2.4vw, 1.3rem); line-height: 1.6; }
    .rule { width: 70px; height: 5px; background: #89c9ed; margin: 2.5rem 0; }
    footer { padding: 1.5rem clamp(1.5rem, 6vw, 6rem); color: #9baab5; border-top: 1px solid #34404a; font-size: .85rem; }
  </style>
</head>
<body>
  <header>ELDRBRANDR</header>
  <main>
    <div class="content">
      <div class="eyebrow">Brand · Creative · Digital</div>
      <h1>Ideas made tangible.</h1>
      <div class="rule" aria-hidden="true"></div>
      <p>A simple, responsive HTML5 test site. Built to verify the EldrBrandr workflow from ChatGPT to GitHub and, eventually, Azure.</p>
    </div>
  </main>
  <footer>EldrBrandr · Deployment verification · No client content</footer>
</body>
</html>
